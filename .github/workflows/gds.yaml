name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttihp26b
        with:
          pdk: ihp-sg13g2

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttihp26b

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        continue-on-error: true
        uses: TinyTapeout/tt-gds-action/gl_test@ttihp26b

      - name: Validate gate-level test results
        if: always()
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Check gate-level test results
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          results = Path("test/results.xml")

          if not results.exists():
              raise SystemExit("Gate-level test did not produce test/results.xml")

          root = ET.parse(results).getroot()
          suites = root.findall(".//testsuite")

          failures = sum(int(s.attrib.get("failures", "0")) for s in suites)
          errors = sum(int(s.attrib.get("errors", "0")) for s in suites)

          print(f"Gate-level test results: failures={failures}, errors={errors}")

          if failures or errors:
              raise SystemExit(
                  f"Gate-level test failed: failures={failures}, errors={errors}"
              )

          print("Gate-level test passed: failures=0, errors=0")
          PY

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttihp26b
